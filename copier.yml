_min_copier_version: "9.0"
_subdirectory: .
_exclude:
  - scripts/rename.sh  # one-time rename helper; not meaningful to regenerate in existing repos

_skip_if_exists:
  - k8s/base/deployment.yaml
  - k8s/overlays/dev/patches/configmap.yaml
  - k8s/overlays/staging/patches/configmap.yaml
  - k8s/overlays/prod/patches/configmap.yaml
  # ── Application code (NEVER overwrite on sync) ───────────────────────────
  - src/**
  - index.html
  - package.json
  - .env.example
  - trivy.yaml
  - .trivyignore
  # docs/ARCHITECTURE.md and docs/development.md accumulate real, hand-written project
  # knowledge over time (request flows, module breakdowns, gotchas discovered the hard way).
  # They used to be "regenerated on every sync" — that silently destroyed months of real
  # documentation in service/nestjs-vue-app consumers (#3065); same protection here (#680).
  # docs/index.md is the mkdocs nav landing page, same story. Seeded once from the template's
  # own starter content, then left alone. mkdocs.yml stays Copier-managed.
  - docs/ARCHITECTURE.md
  - docs/development.md
  - docs/index.md

_tasks:
  - "kustomize build k8s/overlays/dev > /dev/null 2>&1 && echo '✓ k8s/overlays/dev builds OK' || echo '⚠  kustomize build k8s/overlays/dev failed — check manifests'"

# Copier-managed files (regenerated on `copier update`):
#   catalog-info.yaml, README.md, CLAUDE.md, mkdocs.yml,
#   .github/workflows/main.yml, pr.yml, promote.yml (platform CI — overwritten on update;
#     if you added custom steps to these files, use a separate workflow file instead),
#   k8s/base/{configmap,service,kustomization,network-policy,service-monitor,prometheus-rule}.yaml,
#   k8s/monitoring/dashboards/{grafana-dashboard.json,kustomization.yaml},
#   k8s/overlays/*/kustomization.yaml, k8s/overlays/*/certificate.yaml,
#   k8s/overlays/dev/resource-quota.yaml, k8s/overlays/*/patches/{ingress,prometheus-rule}.yaml
# Not managed (repo-specific — listed in _skip_if_exists above, never overwritten):
#   k8s/base/deployment.yaml, k8s/overlays/*/patches/configmap.yaml, nginx.conf, src/,
#   docs/{ARCHITECTURE,development,index}.md (seeded once from docs/*.jinja)
#
# NOTE — sidecar on copier update: k8s/base/deployment.yaml is in _skip_if_exists, so
#   the nginx-prometheus-exporter sidecar added at scaffold time will NOT be re-added by
#   `copier update`. If the sidecar spec changes in a future template version, apply the
#   update manually to the deployment.yaml in the target repo.

repo_name:
  type: str
  help: Repository name (e.g. mfe-shell)
  validator: "{% if not (repo_name | regex_search('^[a-z][a-z0-9-]{2,40}$')) %}repo_name must be lowercase kebab-case, 3–41 characters (e.g. mfe-shell){% endif %}"

description:
  type: str
  help: Short description of the MFE (shown in Backstage catalog)

owner:
  type: str
  help: "Backstage owner group (e.g. wecoya/claims-team)"

bounded_context:
  type: str
  help: "DDD bounded context name (e.g. claims, notifications). Used for system labeling and catalog tags. Must be lowercase kebab-case and must not duplicate template tags: typescript, vue, microfrontend."
  validator: "{% if not (bounded_context | regex_search('^[a-z][a-z0-9-]+$')) %}bounded_context must be lowercase kebab-case (e.g. claims, notifications){% endif %}"

managed_skills_source:
  type: str
  default: "private-sovereign-cloud/apps/_templates/shared-skills"
  help: Source of platform-managed shared Copilot skills

managed_skills:
  type: yaml
  default:
    - repo-routing
    - skills-sync
  help: Platform-managed skill IDs
