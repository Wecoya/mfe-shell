apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfe-shell-ingress
  namespace: mfe-shell
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/instance: mfe-shell
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns01-app
    ingress.cilium.io/force-https: "disabled"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - shell.app.wecoya.online
      secretName: mfe-shell-tls
  rules:
    - host: shell.app.wecoya.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfe-shell
                port:
                  name: http
