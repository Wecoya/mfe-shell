---
# NetworkPolicy: mfe-shell-ingress-allow
#
# Default-deny all cross-namespace traffic. Allows only:
#   Ingress: from Cilium Ingress controller (kube-system) on port 8080
#   Egress:  DNS (kube-system:53) + same-namespace
#
# Relies on Cilium CNI for enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mfe-shell-ingress-allow
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mfe-shell
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9113
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
