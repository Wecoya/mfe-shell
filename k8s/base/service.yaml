---
# Service: mfe-shell
#
# ClusterIP service for the nginx pod.
# Port 8080 (http)    — referenced by Ingress in each environment overlay.
# Port 9113 (metrics) — referenced by ServiceMonitor for Prometheus scraping via
#                       the nginx-prometheus-exporter sidecar.
apiVersion: v1
kind: Service
metadata:
  name: mfe-shell
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mfe-shell
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
