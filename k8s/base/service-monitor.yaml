---
# ServiceMonitor — Prometheus scraping for mfe-shell
#
# Enables automatic metrics collection by the Prometheus Agent running on the App Cluster.
# Metrics are remote-written to the Management Cluster Prometheus and visible in Grafana.
#
# Label "release: prometheus" matches the serviceMonitorSelector configured in
# infra/app-cluster/prometheus-agent-app-cluster.yaml.
#
# Prerequisites:
#   - nginx-prometheus-exporter sidecar exposes port "metrics" (9113) via stub_status
#   - NetworkPolicy must allow ingress from monitoring namespace on port 9113 (see network-policy.yaml)
#
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mfe-shell
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: private-sovereign-cloud
    app.kubernetes.io/managed-by: argocd
    release: prometheus  # must match serviceMonitorSelector in prometheus-agent-app-cluster
spec:
  # jobLabel sets the Prometheus `job` label to the value of this pod label.
  # Without this, `job` defaults to "<namespace>/<ServiceMonitor-name>", which breaks
  # Grafana dashboard queries that filter by job="$service".
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: mfe-shell
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scheme: http
  namespaceSelector:
    # Scrape across all environments (dev / staging / prod) — the selector above
    # already limits targets to pods labelled app.kubernetes.io/name=mfe-shell.
    any: true
