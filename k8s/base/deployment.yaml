---
# Deployment: MFE_NAME
#
# Serves the Vue 3 Module Federation microfrontend as a static nginx app.
# Runtime config (/config.json) is generated at container startup from the
# MFE_NAME-config ConfigMap (env-specific API URLs + remote entry endpoints).
#
# Security: multi-stage image (node build → nginx:alpine), non-root, read-only root fs.
# Writable dirs for nginx: /tmp, /var/cache/nginx, /var/run (emptyDir volumes).
#
# Overlays patch:
#   - namespace (MFE_NAME-{dev,staging,prod})
#   - image tag (newTag in kustomization.yaml)
#   - replicas (prod: 2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: MFE_NAME
  labels:
    app.kubernetes.io/name: MFE_NAME
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # Replace=true allows ArgoCD to delete+recreate this Deployment when spec.selector
    # changes (immutable field). Without this, SSA mode has no --force escape hatch.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: MFE_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: MFE_NAME
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: wecoya-platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: config-gen
          image: ghcr.io/wecoya/MFE_NAME:main
          command:
            - sh
            - -c
            - |
              set -e
              echo "Generating /config/config.json from environment..."
              cat > /config/config.json <<EOF
              {
                "keycloak_url": "${KEYCLOAK_URL}",
                "keycloak_realm": "${KEYCLOAK_REALM}",
                "api_base_url": "${API_BASE_URL}"
              }
              EOF
              echo "Done."
          envFrom:
            - configMapRef:
                name: MFE_NAME-config
          volumeMounts:
            - name: config-volume
              mountPath: /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nginx
          image: ghcr.io/wecoya/MFE_NAME:main
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 101   # nginx user in nginx:alpine
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config-volume
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
