---
# Kustomize base: mfe-shell
#
# Environment-agnostic resources for the MFE nginx deployment.
# Each overlay (dev/staging/prod) adds:
#   - namespace
#   - Ingress (env-specific hostname + ExternalDNS annotation)
#   - Certificate (env-specific TLS cert via cert-manager)
#   - ConfigMap patch (env-specific API endpoints + MFE remote entry URLs)
#   - Image tag (newTag via images override)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - network-policy.yaml
  - service-monitor.yaml
  - prometheus-rule.yaml
  - ghcr-pull-secret.yaml
