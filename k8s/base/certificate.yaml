---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mfe-shell-tls
  namespace: mfe-shell
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/instance: mfe-shell
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
spec:
  secretName: mfe-shell-tls
  dnsNames:
    - shell.app.wecoya.online
  issuerRef:
    name: letsencrypt-prod-dns01-app
    kind: ClusterIssuer
    group: cert-manager.io
  renewBefore: 720h
