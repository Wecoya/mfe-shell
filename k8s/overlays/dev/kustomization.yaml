apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mfe-shell-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: mfe-shell
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: ConfigMap
      name: mfe-shell-config
    patch: |
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "https://auth.dev.wecoya.de"
      - op: replace
        path: /data/MFE_REMOTES
        value: '{"claims":"https://claims.dev.wecoya.de/remoteEntry.js"}'

  # Override Ingress host to dev-specific subdomain.
  # No wildcard *.app.wecoya.online exists — DNS record shell-dev.app.wecoya.online
  # is managed explicitly via Crossplane HetznerDNSRecord in infra repo.
  - target:
      kind: Ingress
      name: mfe-shell
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: shell-dev.app.wecoya.online
      - op: replace
        path: /spec/tls/0/secretName
        value: mfe-shell-dev-tls
      - op: replace
        path: /spec/rules/0/host
        value: shell-dev.app.wecoya.online
