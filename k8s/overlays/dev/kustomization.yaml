---
# Kustomize overlay: dev
#
# Deploys MFE_NAME to namespace MFE_NAME-dev on psc-app-cluster.
# Domain: MFE_NAME-dev.app.wecoya.online
#
# CI flow: merge to main → build.yml pushes image, updates newTag here →
#   ArgoCD auto-syncs MFE_NAME-dev (~5 min propagation).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: MFE_NAME-dev

resources:
  - ../../base
  - resource-quota.yaml
  - certificate.yaml
  - patches/ingress.yaml

images:
  - name: ghcr.io/wecoya/MFE_NAME
    newTag: main   # CI rewrites this to the actual SHA on each merge

patches:
  - path: patches/configmap.yaml
    target:
      kind: ConfigMap
      name: MFE_NAME-config

labels:
  - pairs:
      psc.wecoya.io/service: MFE_NAME
      psc.wecoya.io/environment: dev
    includeSelectors: false
