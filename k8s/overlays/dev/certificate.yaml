---
# Certificate: mfe-shell-dev-tls
#
# TLS certificate for mfe-shell-dev.app.wecoya.online via Let's Encrypt DNS-01.
# Uses the App Cluster ClusterIssuer (letsencrypt-prod-dns01-app).
# Issuance: up to 5 min on first issue (DNS-01 propagation).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mfe-shell-dev-tls
  namespace: mfe-shell-dev
  labels:
    app.kubernetes.io/name: mfe-shell-dev-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretName: mfe-shell-dev-tls
  dnsNames:
    - mfe-shell-dev.app.wecoya.online
  issuerRef:
    name: letsencrypt-prod-dns01-app
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
