---
# Ingress: MFE_NAME (dev)
#
# Exposes MFE_NAME-dev at MFE_NAME-dev.app.wecoya.online.
# TLS terminated at Ingress using the cert from certificate.yaml.
#
# DNS: Managed via Crossplane HetznerDNSRecord Claim in the infra repo.
#   File: infra/base/crossplane/claims/dns/MFE_NAME-dev-app-a.yaml
#   ExternalDNS source:ingress is disabled on app-cluster (caused node-IP conflicts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: MFE_NAME
  namespace: MFE_NAME-dev
  labels:
    app.kubernetes.io/name: MFE_NAME
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    ingress.cilium.io/force-https: "true"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - MFE_NAME-dev.app.wecoya.online
      secretName: MFE_NAME-dev-tls
  rules:
    - host: MFE_NAME-dev.app.wecoya.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: MFE_NAME
                port:
                  number: 8080
