---
# Ingress: mfe-shell (dev)
#
# Exposes mfe-shell-dev at mfe-shell-dev.app.wecoya.online.
# TLS terminated at Ingress using the cert from certificate.yaml.
#
# DNS: Managed via Crossplane HetznerDNSRecord Claim in the infra repo.
#   File: infra/base/crossplane/claims/dns/mfe-shell-dev-app-a.yaml
#   ExternalDNS source:ingress is disabled on app-cluster (caused node-IP conflicts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfe-shell
  namespace: mfe-shell-dev
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    ingress.cilium.io/force-https: "true"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - mfe-shell-dev.app.wecoya.online
      secretName: mfe-shell-dev-tls
  rules:
    - host: mfe-shell-dev.app.wecoya.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfe-shell
                port:
                  number: 8080
