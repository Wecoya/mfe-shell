---
# Ingress: mfe-shell (dev)
#
# Exposes mfe-shell at shell-dev.app.wecoya.online.
# TLS uses wildcard-app-wecoya-online-tls (patched by kustomization.yaml).
#
# DNS: shell-dev.app.wecoya.online managed via Crossplane HetznerDNSRecord.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfe-shell
  namespace: mfe-shell
  labels:
    app.kubernetes.io/name: mfe-shell
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    ingress.cilium.io/force-https: "true"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - shell-dev.app.wecoya.online
      secretName: mfe-shell-dev-tls
  rules:
    - host: shell-dev.app.wecoya.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfe-shell
                port:
                  number: 8080
