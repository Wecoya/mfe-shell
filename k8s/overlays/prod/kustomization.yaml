apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mfe-shell-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: mfe-shell
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: mfe-shell-alerts
    path: patches/prometheus-rule.yaml

  # Use the cluster-wide wildcard certificate already provisioned for app.wecoya.online.
  - target:
      kind: Ingress
      name: mfe-shell
    patch: |
      - op: replace
        path: /spec/tls/0/secretName
        value: wildcard-app-wecoya-online-tls
