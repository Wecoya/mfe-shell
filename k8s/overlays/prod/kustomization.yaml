---
# Kustomize overlay: prod
#
# Deploys mfe-shell to namespace mfe-shell-prod on psc-app-cluster.
# Domain: mfe-shell.app.wecoya.online (no env suffix — production is canonical)
# Image tag: updated via promote.yml with GitHub Environment approval gate.
# Replicas: 2 (no cold starts in production).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mfe-shell-prod

resources:
  - ../../base
  - certificate.yaml
  - patches/ingress.yaml

images:
  - name: ghcr.io/wecoya/mfe-shell
    newTag: main   # promote.yml rewrites this to the released SHA

patches:
  - path: patches/replicas.yaml
    target:
      kind: Deployment
      name: mfe-shell
  - path: patches/configmap.yaml
    target:
      kind: ConfigMap
      name: mfe-shell-config
  - path: patches/prometheus-rule.yaml
    target:
      kind: PrometheusRule
      name: mfe-shell-alerts

labels:
  - pairs:
      psc.wecoya.io/service: mfe-shell
      psc.wecoya.io/environment: prod
    includeSelectors: false
