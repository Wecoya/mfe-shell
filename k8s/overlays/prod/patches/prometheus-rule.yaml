---
# Patch: upgrade PrometheusRule alert severity to critical in production.
# Applied on top of k8s/base/prometheus-rule.yaml by the prod overlay kustomization.
#
# Strategic merge patch — each rule block must match by alert name.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mfe-shell-alerts
spec:
  groups:
    - name: mfe-shell.availability
      rules:
        - alert: MFEDown
          expr: nginx_up{job="mfe-shell", cluster="psc-app-01"} == 0
          for: 1m
          labels:
            severity: critical
            service: mfe-shell
            component: microfrontend
        - alert: MFEPodRestarting
          expr: |
            increase(kube_pod_container_restarts_total{
              container="nginx",
              namespace=~"mfe-shell-.*",
              cluster="psc-app-01"
            }[15m]) > 2
          for: 5m
          labels:
            severity: critical
            service: mfe-shell
            component: microfrontend
        - alert: MFEExporterRestarting
          expr: |
            increase(kube_pod_container_restarts_total{
              container="nginx-prometheus-exporter",
              namespace=~"mfe-shell-.*",
              cluster="psc-app-01"
            }[15m]) > 2
          for: 5m
          labels:
            severity: critical
            service: mfe-shell
            component: microfrontend
    - name: mfe-shell.load
      rules:
        - alert: MFEHighConnectionLoad
          expr: nginx_connections_active{job="mfe-shell", cluster="psc-app-01"} > 500
          for: 5m
          labels:
            severity: critical
            service: mfe-shell
            component: microfrontend
        - alert: MFERequestRateDrop
          expr: |
            (
              rate(nginx_http_requests_total{job="mfe-shell", cluster="psc-app-01"}[5m])
              /
              rate(nginx_http_requests_total{job="mfe-shell", cluster="psc-app-01"}[30m] offset 5m)
            ) < 0.1
            and
            rate(nginx_http_requests_total{job="mfe-shell", cluster="psc-app-01"}[30m] offset 5m) > 0.01
          for: 2m
          labels:
            severity: critical
            service: mfe-shell
            component: microfrontend
