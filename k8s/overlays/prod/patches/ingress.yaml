---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: MFE_NAME
  namespace: MFE_NAME-prod
  labels:
    app.kubernetes.io/name: MFE_NAME
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: wecoya-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    ingress.cilium.io/force-https: "true"
    # DNS: Crossplane HetznerDNSRecord in infra/base/crossplane/claims/dns/MFE_NAME-app-a.yaml
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - MFE_NAME.app.wecoya.online
      secretName: MFE_NAME-prod-tls
  rules:
    - host: MFE_NAME.app.wecoya.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: MFE_NAME
                port:
                  number: 8080
