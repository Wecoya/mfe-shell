name: PR Quality Gate

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write
  checks: write
  pull-requests: write

jobs:
  quality:
    uses: Wecoya/platform-actions/.github/workflows/reusable-quality.yml@main
    with:
      coverage-threshold: 70
      node-version: "22"
    secrets: inherit

  codeql-mode-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Verify advanced CodeQL compatibility
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # Informational only — never blocks the PR. See main.yml for full rationale.
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const response = await github.request("GET /repos/{owner}/{repo}/code-scanning/default-setup", {
                owner,
                repo,
                headers: { "X-GitHub-Api-Version": "2022-11-28" }
              });
              const state = response.data?.state ?? "unknown";
              const languages = response.data?.languages ?? [];
              core.info(`Code scanning default setup state: ${state} (languages: ${languages.join(", ") || "none"})`);
              if (state !== "not-configured") {
                const message = `Code scanning default setup is '${state}' (languages: ${languages.join(", ") || "none"}). codeql.yml will detect this at runtime and skip overlapping language matrix entries to avoid SARIF conflicts. To fully migrate to the advanced workflow, an org admin can disable default setup in repository settings.`;
                core.warning(message);
                await core.summary.addHeading("CodeQL mode: coexistence detected").addRaw(message).write();
              }
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.info(`Code scanning default setup endpoint returned ${error.status}; treating as not configured — informational only.`);
                return;
              }
              const message = `Could not verify CodeQL mode compatibility (HTTP ${error.status ?? "unknown"}): ${error.message}. Informational only, build will proceed.`;
              core.warning(message);
              await core.summary.addHeading("CodeQL mode compatibility check skipped").addRaw(message).write();
            }


  security:
    needs: [quality, codeql-mode-preflight]
    uses: Wecoya/platform-actions/.github/workflows/reusable-security-scan.yml@main
    with:
      scan-dockerfile: true
      iac-dirs: "k8s/"
    secrets: inherit
