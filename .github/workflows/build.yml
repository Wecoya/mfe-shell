# GitHub Actions: Build & Deploy to Dev
#
# Triggers on every push to main:
#   1. Build multi-stage Docker image (Vue 3 Vite + nginx)
#   2. Push to ghcr.io/wecoya/MFE_NAME:<sha>
#   3. Update k8s/overlays/dev/kustomization.yaml with the new image SHA
#   4. Commit and push → ArgoCD auto-syncs MFE_NAME-dev
#
# Step 3 is CONDITIONAL on step 2 succeeding (needs: [build-and-push]).
# A failed Docker build never triggers a kustomization update.
name: Build and Deploy to Dev

on:
  push:
    branches:
      - main

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wecoya/MFE_NAME

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-sha: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-dev-overlay:
    name: Update Dev Overlay
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update dev image tag
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image-sha }}
        run: |
          cd k8s/overlays/dev
          kustomize edit set image ghcr.io/wecoya/MFE_NAME=ghcr.io/wecoya/MFE_NAME:${IMAGE_SHA}

      - name: Commit and push
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image-sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "chore(deploy): update dev image to ${IMAGE_SHA}" || echo "No changes to commit"
          git push

  push-metrics:
    name: Push CI Metrics
    needs: [build-and-push, update-dev-overlay]
    if: always()
    permissions: {}
    uses: Wecoya/private-sovereign-cloud/.github/workflows/push-build-metrics.yml@main
    with:
      status: ${{ needs.update-dev-overlay.result }}
      type: deploy
      env: dev
      version: ${{ needs.build-and-push.outputs.image-sha }}
    secrets:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
