# GitHub Actions: Promote Image to Staging or Prod
#
# Manual trigger (workflow_dispatch) only.
# Promotes a known image SHA from dev → staging or dev → prod.
#
# Inputs:
#   target_env  — staging | prod
#   image_sha   — the container image SHA to promote (short SHA from ghcr.io)
#
# Prod requires approval via the GitHub Environment "production" gate.
# The workflow writes to kustomization.yaml ONLY after the gate is approved.
#
# Audit trail: every promotion is recorded as a Git commit:
#   chore(deploy): promote <sha> to <env>
name: Promote to Environment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - prod
      image_sha:
        description: Image SHA to promote (e.g. abc1234)
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    uses: Wecoya/platform-actions/.github/workflows/reusable-promote.yml@main
    with:
      target_env: ${{ inputs.target_env }}
      image_sha: ${{ inputs.image_sha }}
    secrets: inherit

  push-metrics:
    needs: promote
    if: needs.promote.result == 'success' || needs.promote.result == 'failure'
    uses: Wecoya/private-sovereign-cloud/.github/workflows/push-build-metrics.yml@main
    with:
      status: ${{ needs.promote.result }}
      type: deploy
      env: ${{ inputs.target_env }}
      version: ${{ inputs.image_sha }}
    secrets:
      # push-build-metrics.yml only declares TAILSCALE_AUTHKEY; explicit passing
      # (not `secrets: inherit`) limits secret exposure to what the callee needs.
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
