name: Promote to Environment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - prod
      image_sha:
        description: "Full 40-char image SHA to promote (from ghcr.io/wecoya/<service>:<sha>)"
        required: true
        type: string

jobs:
  promote:
    uses: Wecoya/platform-actions/.github/workflows/reusable-promote.yml@main
    with:
      target_env: ${{ inputs.target_env }}
      image_sha: ${{ inputs.image_sha }}
    secrets: inherit
