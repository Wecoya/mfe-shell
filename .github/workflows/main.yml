name: Main Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "k8s/overlays/**/kustomization.yaml"
      - "k8s/overlays/**/kustomization.yml"

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write
  checks: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    uses: Wecoya/platform-actions/.github/workflows/reusable-quality.yml@main
    with:
      coverage-threshold: 70
      node-version: "22"
    secrets: inherit

  security:
    uses: Wecoya/platform-actions/.github/workflows/reusable-security-scan.yml@main
    with:
      scan-dockerfile: true
      iac-dirs: "k8s/"
    secrets: inherit

  build-deploy:
    needs: [quality, security]
    uses: Wecoya/platform-actions/.github/workflows/reusable-build.yml@main
    with:
      template-type: mfe
      environment: dev
      node-version: "22"
    secrets: inherit

  metrics:
    needs: [build-deploy]
    if: always()
    uses: Wecoya/platform-actions/.github/workflows/reusable-notify.yml@main
    with:
      type: deploy
      status: ${{ needs.build-deploy.result }}
      repo: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      version: ${{ github.sha }}
      template: web-app
      env: dev
      prove-visibility: ${{ github.run_number <= 3 }}
    secrets: inherit
