name: Main Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'k8s/overlays/**/kustomization.yaml'
      - 'k8s/overlays/**/kustomization.yml'

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write
  checks: write
  pull-requests: write
  id-token: write

# Intentional exclusions for the MFE pattern:
# - openapi-contract: MFE repos have no backend server and expose no OpenAPI contract.
# - codeql-mode-preflight / codeql.yml: No server-side TypeScript/Python surface to scan.
# These exclusions are by design — they are NOT gaps to fill.

jobs:
  quality:
    uses: Wecoya/platform-actions/.github/workflows/reusable-quality.yml@main
    with:
      coverage-threshold: 70
      node-version: '22'
    secrets: inherit

  security:
    needs: [quality]
    uses: Wecoya/platform-actions/.github/workflows/reusable-security-scan.yml@main
    with:
      scan-dockerfile: true
      iac-dirs: 'k8s/'
    secrets: inherit

  build-deploy:
    needs: [quality, security]
    uses: Wecoya/platform-actions/.github/workflows/reusable-build.yml@main
    with:
      template-type: mfe
      environment: dev
    secrets: inherit

  metrics:
    needs: [build-deploy]
    if: always()
    uses: Wecoya/platform-actions/.github/workflows/reusable-notify.yml@main
    with:
      type: deploy
      status: ${{ needs.build-deploy.result }}
      repo: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      version: ${{ github.sha }}
      template: create-vue-microfrontend
      env: dev
      prove-visibility: ${{ github.run_number <= 3 }}
    secrets: inherit
