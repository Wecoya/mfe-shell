name: Main Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "k8s/overlays/**/kustomization.yaml"
      - "k8s/overlays/**/kustomization.yml"

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write
  checks: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    uses: Wecoya/platform-actions/.github/workflows/reusable-quality.yml@main
    with:
      coverage-threshold: 70
      node-version: "22"
    secrets: inherit

  codeql-mode-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Verify advanced CodeQL compatibility
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # This is an informational check, NOT a gate. It surfaces default-setup state
          # for visibility, but never blocks the build:
          # - 403/permission errors: GITHUB_TOKEN lacks Administration scope (expected in most orgs).
          # - state=configured: codeql.yml has a runtime guard that detects this and skips
          #   conflicting language matrix entries, so SARIF conflicts are already prevented.
          # - state=not-configured / 404: ideal — advanced workflow runs unrestricted.
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const response = await github.request("GET /repos/{owner}/{repo}/code-scanning/default-setup", {
                owner,
                repo,
                headers: { "X-GitHub-Api-Version": "2022-11-28" }
              });
              const state = response.data?.state ?? "unknown";
              const languages = response.data?.languages ?? [];
              core.info(`Code scanning default setup state: ${state} (languages: ${languages.join(", ") || "none"})`);
              if (state !== "not-configured") {
                const message = `Code scanning default setup is '${state}' (languages: ${languages.join(", ") || "none"}). codeql.yml will detect this at runtime and skip overlapping language matrix entries to avoid SARIF conflicts. To fully migrate to the advanced workflow, an org admin can disable default setup in repository settings.`;
                core.warning(message);
                await core.summary.addHeading("CodeQL mode: coexistence detected").addRaw(message).write();
              }
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.info(`Code scanning default setup endpoint returned ${error.status}; treating as not configured — informational only.`);
                return;
              }
              const message = `Could not verify CodeQL mode compatibility (HTTP ${error.status ?? "unknown"}): ${error.message}. Informational only, build will proceed.`;
              core.warning(message);
              await core.summary.addHeading("CodeQL mode compatibility check skipped").addRaw(message).write();
            }

  security:
    needs: [quality, codeql-mode-preflight]
    uses: Wecoya/platform-actions/.github/workflows/reusable-security-scan.yml@main
    with:
      scan-dockerfile: true
      iac-dirs: "k8s/"
    secrets: inherit


  build-deploy:
    needs: [quality, security]
    uses: Wecoya/platform-actions/.github/workflows/reusable-build.yml@main
    with:
      template-type: mfe
      environment: dev
      node-version: "22"
    secrets: inherit

  metrics:
    needs: [quality, security, build-deploy]
    if: always()
    uses: Wecoya/platform-actions/.github/workflows/reusable-notify.yml@main
    with:
      type: deploy
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || needs.build-deploy.result }}
      repo: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      version: ${{ github.sha }}
      template: web-app
      env: dev
      prove-visibility: ${{ github.run_number <= 3 }}
    secrets: inherit
