name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 0 * * 4"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect CodeQL default setup state
        id: default_setup
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${{ github.repository }}/code-scanning/default-setup"
          RESPONSE="$(curl -sS -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "$API_URL" || true)"
          STATE="$(printf '%s' "$RESPONSE" | tr -d '\n' | sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          if [ -z "$STATE" ]; then
            STATE="unknown"
          fi
          if [ "$STATE" = "configured" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Default setup is enabled; skipping advanced CodeQL to avoid SARIF conflict."
          elif [ "$STATE" = "not-configured" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Default setup is disabled; running advanced CodeQL."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine default setup state (state=$STATE); skipping advanced CodeQL defensively."
          fi

      - name: Initialize CodeQL
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: matrix.build-mode == 'manual' && steps.default_setup.outputs.enabled != 'true'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo "  make bootstrap"
          echo "  make release"
          exit 1

      - name: Perform CodeQL Analysis
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
