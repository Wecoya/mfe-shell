name: 'CodeQL Advanced'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '30 0 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1

      - name: Detect CodeQL default setup state
        id: default_setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE="$(gh api \
            /repos/${{ github.repository }}/code-scanning/default-setup \
            --jq '.state' 2>/dev/null || echo 'unknown')"
          if [ "$STATE" = "configured" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Default setup is enabled; skipping advanced CodeQL to avoid SARIF conflict."
          elif [ "$STATE" = "not-configured" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Default setup is disabled; running advanced CodeQL."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine default setup state (state=${STATE}); skipping advanced CodeQL defensively."
          fi

      - name: Initialize CodeQL
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # codeql-action@v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # codeql-action@v4.36.2
        with:
          category: '/language:${{matrix.language}}'
