# Service-repo agent workflow — generated by task 9.49 (cross-repo dispatch)
# Triggered by repository_dispatch from Wecoya/private-sovereign-cloud orchestrator.
# Dispatch origin: github.event.client_payload.repo
#
# CANONICAL SOURCE: apps/_templates/agent.yml — update that file and propagate
# changes to all template copies. Do NOT edit this copy in isolation.
#
# TRUST MODEL: The only way to send a repository_dispatch to this repo is by
# holding AGENT_PAT with `repo` scope. Keeping AGENT_PAT secret is the primary
# security boundary. client_payload fields are treated as untrusted strings and
# bound to env vars before any use in run: commands.
#
# Required secrets (configure once in repository Settings → Secrets):
#   ANTHROPIC_API_KEY  — Anthropic API key for claude-code-action
#   AGENT_PAT          — PAT with repo scope (used by claude-code-action for git ops)

name: Autonomous Agent (dispatch)

on:
  repository_dispatch:
    types: [agent-task]

# Prevent duplicate runs for the same issue. cancel-in-progress: false avoids
# killing an in-flight 60-min job if a delayed retry arrives.
# Note: expression syntax is required in concurrency keys; env: substitution is
# not supported there. issue_number is validated to [0-9]+ in the step below.
concurrency:
  group: agent-dispatch-${{ github.repository }}-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

# Restrictive default — job declares only what it needs.
permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Validate client_payload fields before any further use.
      # Reject runs where issue_number is not a plain integer (prevents crafted
      # concurrency-group names from being acted upon downstream).
      - name: Validate dispatch payload
        env:
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          SOURCE_REPO:  ${{ github.event.client_payload.repo }}
        run: |
          if ! [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::client_payload.issue_number is not a valid integer: '${ISSUE_NUMBER}'"
            exit 1
          fi
          echo "[agent] Dispatch from ${SOURCE_REPO:-unknown} for issue #${ISSUE_NUMBER}"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
        with:
          token: ${{ secrets.AGENT_PAT }}

      - name: Run claude-code-action (Automation Mode)
        uses: anthropics/claude-code-action@8897fb4a6a67cd7564a6da5aa60f5f518b61f584  # v1
        with:
          prompt: ${{ github.event.client_payload.prompt }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Explicit allowlist — no blanket bypass.
          allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
